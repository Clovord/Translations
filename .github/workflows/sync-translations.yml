          cp -R "$ROOT_DIR"/DownloadPage/* assets/translations/

          git add -A assets/translations
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Sync translations (Downloads)"
          git push origin "${BRANCH}" --force-with-lease

          git fetch origin "${BASE_BRANCH}"
          git rebase -X ours "origin/${BASE_BRANCH}"
          git push origin "${BRANCH}" --force-with-lease

          export GH_TOKEN="$TOKEN"
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "${BRANCH}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "${PR_NUMBER}" ]; then
            gh pr create \
              --repo "$REPO" \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "Sync translations (Downloads)" \
