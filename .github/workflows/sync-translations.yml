            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --head "${BRANCH}" \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          MERGE_OUTPUT=$(gh pr merge \
            --repo "$REPO" \
            --squash \
            "${PR_NUMBER}" 2>&1) || MERGE_STATUS=$?

          if [ "${MERGE_STATUS:-0}" -ne 0 ]; then
            echo "${MERGE_OUTPUT}"
            exit "${MERGE_STATUS}"
          fi

  sync-support:
    needs: detect
    if: needs.detect.outputs.support == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync SupportPortal translations
        env:
          TOKEN: ${{ secrets.SYNC_SUPPORTPORTAL_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          ROOT_DIR="$PWD"
          BRANCH="automation/sync-support-translations"
          BASE_BRANCH="main"
          REPO="Clovord/SupportPortal"

          if [ -z "$TOKEN" ]; then
