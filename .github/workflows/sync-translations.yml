name: Sync Translations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_all:
        description: Sync all translation targets
        type: boolean
        default: true

concurrency:
  group: sync-translations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files are non-empty and parseable
        run: |
          python scripts/validate_translations.py

  detect:
    needs: validate-json
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect-changes.outputs.api }}
      webapp: ${{ steps.detect-changes.outputs.webapp }}
      downloads: ${{ steps.detect-changes.outputs.downloads }}
      desktop: ${{ steps.detect-changes.outputs.desktop }}
      mobile: ${{ steps.detect-changes.outputs.mobile }}
      support: ${{ steps.detect-changes.outputs.support }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed translation categories
        id: detect-changes
        env:
          SYNC_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_all }}
        run: |
          set -euo pipefail

          write_outputs() {
            echo "api=$1" >> "$GITHUB_OUTPUT"
            echo "webapp=$2" >> "$GITHUB_OUTPUT"
            echo "downloads=$3" >> "$GITHUB_OUTPUT"
            echo "desktop=$4" >> "$GITHUB_OUTPUT"
            echo "mobile=$5" >> "$GITHUB_OUTPUT"
            echo "support=$6" >> "$GITHUB_OUTPUT"
          }

          if [ "${SYNC_ALL}" = "true" ]; then
            echo "Manual dispatch: syncing all targets"
            write_outputs true true true true true true
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            CHANGED="$(git diff --name-only "${AFTER}~1" "$AFTER" || true)"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
          fi

          echo "Changed files in push:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^\.github/workflows/sync-translations\.yml$'; then
            echo "Sync workflow changed; forcing full sync to catch up pending translations"
            write_outputs true true true true true true
            exit 0
          fi

          api=false
          webapp=false
          downloads=false
          desktop=false
          mobile=false
          support=false

          if echo "$CHANGED" | grep -q '^API/'; then api=true; fi
          if echo "$CHANGED" | grep -q '^WebApp/'; then webapp=true; fi
          if echo "$CHANGED" | grep -q '^DownloadPage/'; then downloads=true; fi
          if echo "$CHANGED" | grep -q '^DesktopApp/'; then desktop=true; fi
          if echo "$CHANGED" | grep -q '^MobileApp/'; then mobile=true; fi
          if echo "$CHANGED" | grep -q '^SupportPortal/'; then support=true; fi

          # WebApp changes also feed Desktop/Mobile override bundles.
          if [ "$webapp" = true ]; then
            desktop=true
            mobile=true
          fi

          write_outputs "$api" "$webapp" "$downloads" "$desktop" "$mobile" "$support"

          echo "Detect results: api=$api webapp=$webapp downloads=$downloads desktop=$desktop mobile=$mobile support=$support"

  trigger-translation-webhook:
    needs: detect
    if: |
      needs.detect.outputs.api == 'true' || needs.detect.outputs.webapp == 'true' || needs.detect.outputs.desktop == 'true' || needs.detect.outputs.mobile == 'true' || needs.detect.outputs.downloads == 'true' || needs.detect.outputs.support == 'true'
    runs-on: ubuntu-latest
    steps:
      # Prefer latest main so merged auto-translations are included
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger translation webhook
        env:
          API_BASE_URL: ${{ secrets.ORG_API_BASE_URL }}
          BUILD_WEBHOOK_TOKEN: ${{ secrets.CLOVORD_BUILD_WEBHOOK_SECRET || secrets.ORG_API_BUILD_WEBHOOK_SECRET }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/trigger_translation_webhook.py

  sync-api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync API translations
        env:
          TOKEN: ${{ secrets.SYNC_API_TOKEN }}
        run: |
          ROOT_DIR="$PWD"
          BRANCH="automation/sync-api-translations"
          BASE_BRANCH="main"
          REPO="Clovord/API"

          if [ -z "$TOKEN" ]; then
            echo "SYNC_API_TOKEN is empty or not configured"
            exit 1
          fi

          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.git" target
          cd target

          git config user.email "bot@clovord.com"
          git config user.name "Clovord Bot"
          git fetch origin "${BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}" "origin/${BASE_BRANCH}"
          fi

          python "$ROOT_DIR/scripts/require_codeowners.py" --repo-dir "$PWD" --required-path "translations/"

          rm -rf translations
          mkdir -p translations
          cp -R "$ROOT_DIR"/API/* translations/

          git add -A translations
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Sync translations (API)"
          git push origin "${BRANCH}" --force-with-lease

          rebase_push_success=0
          for attempt in 1 2 3; do
            git fetch origin "${BASE_BRANCH}"
            if ! git rebase -X ours "origin/${BASE_BRANCH}"; then
              git rebase --abort || true
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
                continue
              fi
              echo "Rebase failed after ${attempt} attempts"
              exit 1
            fi

            if git push origin "${BRANCH}" --force-with-lease; then
              rebase_push_success=1
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          if [ "$rebase_push_success" -ne 1 ]; then
            echo "Failed to push rebased branch after retries"
            exit 1
          fi

          export GH_TOKEN="$TOKEN"
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "${BRANCH}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "${PR_NUMBER}" ]; then
            gh pr create \
              --repo "$REPO" \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "Sync translations (API)" \
              --body "Automated translation sync from Translations."

            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --head "${BRANCH}" \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          MERGE_OUTPUT=$(gh pr merge \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            "${PR_NUMBER}" 2>&1) || MERGE_STATUS=$?

          if [ "${MERGE_STATUS:-0}" -ne 0 ]; then
            echo "${MERGE_OUTPUT}"
            exit "${MERGE_STATUS}"
          fi

  sync-webapp:
    needs: detect
    if: needs.detect.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync WebApp translations
        env:
          TOKEN: ${{ secrets.SYNC_WEBAPP_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          ROOT_DIR="$PWD"
          BRANCH="automation/sync-webapp-translations"
          BASE_BRANCH="master"
          REPO="Clovord/Homepage"

          if [ -z "$TOKEN" ]; then
            echo "SYNC_WEBAPP_TOKEN is empty or not configured"
            exit 1
          fi

          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.git" target
          cd target

          git config user.email "bot@clovord.com"
          git config user.name "Clovord Bot"
          git fetch origin "${BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}" "origin/${BASE_BRANCH}"
          fi

          python "$ROOT_DIR/scripts/require_codeowners.py" --repo-dir "$PWD" --required-path "dist/assets/translations/"

          if ! compgen -G "$ROOT_DIR/WebApp/*.json" > /dev/null; then
            echo "No source translation files found in $ROOT_DIR/WebApp"
            exit 1
          fi

          TMP_TRANSLATIONS_DIR=$(mktemp -d)
          cp -f "$ROOT_DIR"/WebApp/*.json "$TMP_TRANSLATIONS_DIR"/

          mkdir -p dist/assets/translations
          find dist/assets/translations -maxdepth 1 -type f -name "*.json" -delete
          cp -f "$TMP_TRANSLATIONS_DIR"/*.json dist/assets/translations/
          rm -rf "$TMP_TRANSLATIONS_DIR"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source_sha = (os.environ.get("SOURCE_SHA") or "").strip()
          version = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          payload = {
              "version": version,
              "source_commit": source_sha,
              "updated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
          }
          out = Path("dist/assets/translations/manifest.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("Wrote", out)
          PY

          git add -A -f dist/assets/translations
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Sync translations (WebApp)"
          git push origin "${BRANCH}" --force-with-lease

          git fetch origin "${BASE_BRANCH}"
          git rebase -X ours "origin/${BASE_BRANCH}"
          git push origin "${BRANCH}" --force-with-lease

          export GH_TOKEN="$TOKEN"
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "${BRANCH}" \
            --base "${BASE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "${PR_NUMBER}" ]; then
            gh pr create \
              --repo "$REPO" \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "Sync translations (WebApp)" \
              --body "Automated translation sync from Translations."

            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --head "${BRANCH}" \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          MERGE_OUTPUT=$(gh pr merge \
            --repo "$REPO" \
            --squash \
            "${PR_NUMBER}" 2>&1) || MERGE_STATUS=$?

          if [ "${MERGE_STATUS:-0}" -ne 0 ]; then
            echo "${MERGE_OUTPUT}"
            exit "${MERGE_STATUS}"
          fi

